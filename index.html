<style>

*,*::before,*::after{box-sizing:inherit}html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:var(--pat,none);background-size:var(--ps,auto);color:var(--tx);font:16px/1.7 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;display:flex;flex-direction:column}

button:hover{background:var(--ac2)}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}

#anh{flex:1;overflow:auto;padding:10px}.pg{position:relative;width:fit-content;margin:0 auto 12px;background:#fff;box-shadow:0 1px 6px #0004}.pg>canvas,.pg>img{display:block}

.gq{font-size:calc(clamp(1.4rem,4vw,2.4rem)*var(--gs,1));font-weight:700;text-align:center;margin:24px 0;max-width:900px;background:var(--sf);border:2px solid var(--bd);border-radius:18px;padding:22px;width:100%}
.go{display:grid;gap:12px;width:100%;max-width:900px}.go.tf{grid-template-columns:1fr 1fr}
.gb{font-size:calc(clamp(1.1rem,3vw,1.7rem)*var(--gs,1));padding:14px 18px;border-radius:16px;border:3px solid var(--bd);background:var(--sf);text-align:start}.gb:hover{background:var(--ac2)}
.gb.ok{background:#bff0c8;border-color:#2e9e4f;color:#0b3d1a}.gb.no{background:#ffc9c9;border-color:#d64545;color:#5a0d0d}.gb:disabled{opacity:1;cursor:default}
.gf{margin:18px 0;font-size:calc(1.3rem*var(--gs,1));font-weight:700;text-align:center}.gr{text-align:center;max-width:700px;width:100%}.gr .big{font-size:3rem;margin:10px 0}
</style></head><body>
<header><h1>مساعد المعلم</h1><span id="sv"></span><span id="cs" style="font-size:.85rem;opacity:.85"></span><select id="th" aria-label="الثيم"><option value="">كلاسيكي</option><option value="sci">علوم 🔬</option><option value="math">رياضيات ➗</option><option value="star">نجوم لطيفة ⭐</option><option value="candy">ملصقات ملوّنة 🍭</option></select><button data-a="lang">English</button><button id="t1" data-a="tab" data-v="lessons">الدروس</button><button id="t2" data-a="tab" data-v="sched">جدول المواعيد</button><button id="t3" data-a="tab" data-v="stud">الطلاب والحضور</button><button id="t4" data-a="tab" data-v="track">متابعة الطلاب</button><button id="t5" data-a="tab" data-v="stk">لوحة الملصقات</button><button data-a="pz" data-d="-1" aria-label="تصغير">🔍－</button><button data-a="pz" data-d="1" aria-label="تكبير">🔍＋</button><button data-a="pres">⛶ ملء الشاشة</button><button data-a="bk">💾 نسخة احتياطية</button><button id="cl" data-a="cl">☁ تسجيل الدخول</button></header><input type="file" id="imp" accept=".json,application/json" hidden><div id="at" hidden><div class="box" id="atb" style="max-height:80vh;overflow:auto"></div></div><div id="px"><button data-a="pz" data-d="-1">🔍－</button><button data-a="pz" data-d="1">🔍＋</button><button data-a="pres">✕</button></div>
<div id="rem" hidden></div><div class="app"><aside><input id="q" type="search" placeholder="بحث في الدروس…" aria-label="بحث" style="width:100%;margin-bottom:8px"><select id="so" aria-label="ترتيب" style="width:100%;margin-bottom:8px"><option value="man">الترتيب: يدوي</option><option value="new">الترتيب: الأحدث أولاً</option><option value="old">الترتيب: الأقدم أولاً</option></select><div style="display:flex;gap:6px"><select id="gs" aria-label="الصف" style="flex:1;min-width:0"></select><button data-a="addG" style="padding:4px 10px">＋ صف</button></div><div id="tree"></div></aside><main id="main"></main></div>
<input type="file" id="fi" hidden multiple>
<div id="md" hidden><div class="box"><h3 id="mt" style="margin:0"></h3><input id="mi"><div class="row"><button id="ok" class="pri">موافق</button><button id="no">إلغاء</button></div></div></div>
<div id="an" hidden><div id="ant"><button data-a="aC" data-c="rgba(255,221,0,.5)" class="sw" style="background:#ffdd00"></button><button data-a="aC" data-c="rgba(70,230,120,.5)" class="sw" style="background:#46e678"></button><button data-a="aC" data-c="rgba(255,120,190,.5)" class="sw" style="background:#ff78be"></button><input type="color" id="pc" value="#ffdd00" aria-label="لون"><button data-a="tl" data-t="pen">✏️ قلم</button><button data-a="tl" data-t="hl" class="on">🖍 هايلايتر</button><button data-a="tl" data-t="txt">🔤 نص</button><button data-a="tl" data-t="er">🧽 ممحاة</button><label>الحجم <input type="range" id="psz" min="1" max="80" value="22"></label><button data-a="aU">تراجع</button><button data-a="aX">مسح الكل</button><button data-a="zi" style="margin-inline-start:auto" aria-label="تكبير">🔍＋</button><button data-a="zo" aria-label="تصغير">🔍－</button><button data-a="z0">100%</button><button data-a="aE">إغلاق</button></div><div id="anh"></div></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
let S={grades:[],schedule:[]},sel={g:null,s:null,l:null},view='lessons',sc={mode:'week',anchor:new Date(),pick:ymd(new Date())};
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
/* التخزين التلقائي: IndexedDB */
let db=null;const mem={};
const open=()=>new Promise(r=>{try{const q=indexedDB.open('teacher-assistant',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const put=(k,v)=>{mem[k]=v;return new Promise(r=>{if(!db)return r();try{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r}catch(e){r()}})};
const get=k=>new Promise(r=>{if(!db)return r(mem[k]);try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
let tm;const flash=()=>{$('#sv').textContent='✓ تم الحفظ';clearTimeout(flash.t);flash.t=setTimeout(()=>$('#sv').textContent='',2000)};
const save=()=>{$('#sv').textContent='جارٍ الحفظ…';clearTimeout(tm);tm=setTimeout(()=>{S.updatedAt=Date.now();put('state',S).then(()=>{flash();cloudSoon()})},250)};
addEventListener('pagehide',()=>put('state',S));document.addEventListener('visibilitychange',()=>{if(document.hidden)put('state',S)});
const G=()=>S.grades.find(x=>x.id===sel.g),Sb=()=>G()?.subjects.find(x=>x.id===sel.s),L=()=>Sb()?.lessons.find(x=>x.id===sel.l);
function dlg(t,inp,cb){$('#mt').textContent=t;const i=$('#mi');i.hidden=!inp;i.value='';$('#md').hidden=false;if(inp)i.focus();
$('#ok').onclick=()=>{const v=i.value.trim();if(inp&&!v)return;$('#md').hidden=true;cb(v)};$('#no').onclick=()=>$('#md').hidden=true;i.onkeydown=e=>{if(e.key==='Enter')$('#ok').click()}}
async function setSrc(el,fid){const b=await get('f:'+fid);if(!b)return;el.onerror=()=>{el.onerror=null;const r=new FileReader();r.onload=()=>el.src=r.result;r.readAsDataURL(b)};el.src=URL.createObjectURL(b)}
/* الواجهة */
function tree(){$('#tree').innerHTML=S.grades.map(g=>`<details ${g.open?'open':''} data-g="${g.id}"><summary>${esc(g.name)}<span class="b"><button data-a="addS" data-g="${g.id}">＋ مادة</button><button data-a="delG" data-g="${g.id}" aria-label="حذف الصف">🗑</button></span></summary>${g.subjects.map(s=>`<div class="sub"><div style="display:flex;gap:4px;align-items:center"><b style="flex:1">${esc(s.name)}</b><button data-a="addL" data-g="${g.id}" data-s="${s.id}">＋ درس</button><button data-a="delS" data-g="${g.id}" data-s="${s.id}" aria-label="حذف المادة">🗑</button></div>${s.lessons.map(l=>`<a class="les ${l.id===sel.l?'on':''}" data-a="open" data-g="${g.id}" data-s="${s.id}" data-l="${l.id}">${esc(l.name)}</a>`).join('')}</div>`).join('')}</details>`).join('')||'<p style="opacity:.7">ابدئي بإضافة صف، ثم مادة، ثم درس.</p>'}
document.addEventListener('toggle',e=>{const g=S.grades.find(x=>x.id===e.target.dataset?.g);if(g){g.open=e.target.open;save()}},true);
function render(){$('#t1').classList.toggle('on',view==='lessons');$('#t2').classList.toggle('on',view==='sched');tree();
if(view==='sched'){$('#main').innerHTML=schedHtml();cal();return}

el.innerHTML=`<div class="gtop"><span>${g.i+1} / ${g.qs.length}</span><span>⭐ ${g.sc}</span><span id="gtm"></span>${GB(1)}</div><div class="gq" dir="auto">${esc(q.q)}</div><div class="go ${q.t==='tf'?'tf':''}">${q.t==='mc'?q.o.map((o,i)=>`<button class="gb" data-a="ga" data-i="${i}" dir="auto"><b>${'ABCD'[i]}</b> ${esc(o)}</button>`).join(''):`<button class="gb" data-a="ga" data-i="1">${E('✔ صح','✔ True')}</button><button class="gb" data-a="ga" data-i="0">${E('✘ خطأ','✘ False')}</button>`}</div><div class="gf" id="gfb"></div>`;
if(g.t){g.left=g.t;$('#gtm').textContent='⏱ '+g.left;gameTimer()}}
function gameAns(i){const g=GM;if(!g||g.lock)return;g.lock=true;clearInterval(g.tm);const q=g.qs[g.i],c=q.t==='mc'?q.a:(q.a?1:0);
document.querySelectorAll('#gm .gb').forEach(b=>{b.disabled=true;const v=+b.dataset.i;if(v===c)b.classList.add('ok');else if(v===i)b.classList.add('no')});
const ok=i===c;if(ok)g.sc++;else g.wrong.push(q);
$('#gfb').innerHTML=(ok?E('✔ إجابة صحيحة!','✔ Correct!'):(i<0?E('⏱ انتهى الوقت','⏱ Time’s up'):E('✘ إجابة خاطئة','✘ Wrong')))+`<br><button class="pri" data-a="gn" style="margin-top:12px;font-size:1.1rem;padding:8px 22px">${g.i+1>=g.qs.length?E('النتيجة','Results'):E('التالي ←','Next →')}</button>`;
$('#gm .gtop span:nth-child(2)').textContent='⭐ '+g.sc}
function gameEnd(){const g=GM,n=g.qs.length,p=Math.round(g.sc/n*100);
$('#gm').innerHTML=`<div class="gtop"><span></span>${GB(0)}</div><div class="gr"><div class="big">${p>=80?'🏆':p>=50?'👏':'💪'}</div><h2>${g.sc} / ${n} (${p}%)</h2><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="pri" data-a="gp" data-k="${g.kind}">${E('🔄 إعادة اللعب','🔄 Play again')}</button><button data-a="gx">${E('إغلاق','Close')}</button></div>`+(g.wrong.length?`<h3>${E('مراجعة الأخطاء','Review mistakes')}</h3>`+g.wrong.map(q=>`<div class="it" style="text-align:start"><b dir="auto">${esc(q.q)}</b><div class="mu">✔ ${q.t==='mc'?esc(q.o[q.a]):(q.a?E('صح','True'):E('خطأ','False'))}</div></div>`).join(''):'')+`</div>`}
{const r5=render;render=function(){r5();const l=L();if(view==='lessons'&&l&&TF==='games'&&$('#items')){$('#items').innerHTML=gamesHtml(l);applyLang($('#items'))}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,d=t.dataset;
if(a==='qimp')qiOpen();
else if(a==='qok'){const r=parseQuiz($('#qi').value),l=L();if(!r.length){$('#qm').textContent=E('لم أجد أسئلة بالصيغة المتوقعة.','No questions found in the expected format.');return}l.quiz=(l.quiz||[]).concat(r);save();$('#at').hidden=true;render()}
else if(a==='qdel'){const l=L();l.quiz=(l.quiz||[]).filter(x=>x.id!==d.id);save();render()}
else if(a==='qclr')dlg('مسح كل الأسئلة؟',0,()=>{L().quiz=[];save();render()});
else if(a==='gp')gameStart(d.k);
else if(a==='ga')gameAns(+d.i);
else if(a==='gn'){GM.i++;GM.i>=GM.qs.length?gameEnd():gameQ()}
else if(a==='gx'){if(GM)clearInterval(GM.tm);GM=null;$('#gm')?.remove();if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
else if(a==='gpz')gamePause();
else if(a==='grs'&&GM)gameStart(GM.kind);
else if(a==='gfz'){GS=Math.max(.7,Math.min(2.2,Math.round((GS+.15*+d.d)*100)/100));$('#gm').style.setProperty('--gs',GS)}
else if(a==='gfs'){try{if(document.fullscreenElement)document.exitFullscreen();else $('#gm').requestFullscreen?.().catch(()=>{})}catch(_){}}});
document.addEventListener('change',e=>{if(e.target.id==='gt')PT=+e.target.value});
(async()=>{await open();const s=await get('state');if(s)S=s;applyPrefs();render();window._ready=true;if(fuser)cloudSync()})();
</script></body></html>
